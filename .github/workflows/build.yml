name: Build Kuark Final APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Grant Gradle Execution
      run: chmod +x gradlew

    - name: Build Final APK
      run: ./gradlew assembleAfatRelease --no-daemon || ./gradlew assembleDebug --no-daemon

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: Kuark-Final-App
        path: "**/build/outputs/apk/**/*.apk"
